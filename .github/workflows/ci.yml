name: KAIRO checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kairo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 official tag resolved 2026-10-25
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 official tag resolved 2026-10-25
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 official tag resolved 2026-10-25
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/github-publication-20261025/requirements-extraction.txt
      - name: Install extraction and OCR test dependencies
        working-directory: .
        run: |
          python -m pip install --disable-pip-version-check --no-input -r tools/github-publication-20261025/requirements-extraction.txt 'reportlab==4.4.4'
          python -c "from PIL import Image; import pytesseract, pypdf, docx, pptx, openpyxl, pypdfium2, reportlab; print('Python extraction dependencies ready')"
          echo "KAIRO_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Verify OCR engine
        working-directory: .
        run: |
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y tesseract-ocr
          fi
          tesseract --version
      # Serial startup avoids the previously documented parallel SSR startup stall.
      - name: Run complete serial regression suite
        run: node --test --test-concurrency=1 tests/*.test.mjs
      - name: Check production build
        run: npm run build

  coordination:
    name: Shared bus isolation tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 official tag resolved 2026-10-25
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 official tag resolved 2026-10-25
        with:
          python-version: '3.11'
      - name: Exercise coordination bus in temporary databases
        run: python -m unittest discover -s coordination -p 'test_bus.py' -v
