name: KAIRO scoped coding pilot
run-name: KAIRO guarded issue 13 pilot
on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:
    inputs:
      execute:
        description: 'Explicitly attempt a coding run (requires enabled owner switches and approved issue)'
        required: true
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/kairo-agent-reboot-20261025.yml'
      - 'tools/agent-runner-reboot-20261025/**'
permissions:
  contents: read
concurrency:
  group: kairo-agent-reboot-singleton
  cancel-in-progress: false
jobs:
  policy-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node --test tools/agent-runner-reboot-20261025/*.test.mjs
  select:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    outputs:
      selected: ${{ steps.gate.outputs.selected }}
      base_sha: ${{ steps.gate.outputs.base_sha }}
      branch: ${{ steps.gate.outputs.branch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - id: gate
        name: Fail-closed owner, budget, issue, daily-limit and PR conflict gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KAIRO_AGENT_ENABLED: ${{ vars.KAIRO_AGENT_ENABLED }}
          KAIRO_BUDGET_APPROVED: ${{ vars.KAIRO_BUDGET_APPROVED }}
          KAIRO_EXECUTE: ${{ inputs.execute || 'false' }}
        run: node tools/agent-runner-reboot-20261025/policy.mjs select
  generate:
    needs: select
    if: needs.select.outputs.selected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.select.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Refuse missing API key (never pretend an AI job ran)
        env:
          KAIRO_API_KEY_PRESENT: ${{ secrets.KAIRO_CODEX_API_KEY }}
        shell: bash
        run: |
          if [ -z "$KAIRO_API_KEY_PRESENT" ]; then
            echo 'BLOCKED: configure KAIRO_CODEX_API_KEY with an approved provider project budget' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Run actual isolated Codex coding agent
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675
        with:
          openai-api-key: ${{ secrets.KAIRO_CODEX_API_KEY }}
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral"]'
          prompt-file: tools/agent-runner-reboot-20261025/pilot-prompt.md
      - name: Validate and package only newly added pilot proof files
        env:
          KAIRO_PATCH: ${{ runner.temp }}/kairo-agent.patch
        run: node tools/agent-runner-reboot-20261025/policy.mjs create
      - name: Upload bounded patch to separate publication job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kairo-agent-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/kairo-agent.patch
          if-no-files-found: error
          retention-days: 3
          archive: false
  publish:
    needs: [select,generate]
    if: needs.generate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.select.outputs.base_sha }}
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: kairo-agent-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/inbox
      - name: Verify immutable base, allowlisted patch, new-file-only content
        shell: bash
        env:
          KAIRO_PATCH: ${{ runner.temp }}/inbox/kairo-agent.patch
          KAIRO_BASE_SHA: ${{ needs.select.outputs.base_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$KAIRO_BASE_SHA" || { echo 'Main changed; reject stale generated patch'; exit 1; }
          node tools/agent-runner-reboot-20261025/policy.mjs inspect
          git apply --check --index "$KAIRO_PATCH"
          git apply --index "$KAIRO_PATCH"
          node tools/agent-runner-reboot-20261025/policy.mjs verify
      - name: Publish unreviewed DRAFT PR only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KAIRO_BRANCH: ${{ needs.select.outputs.branch }}
        run: |
          set -euo pipefail
          git switch -c "$KAIRO_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'agent(#13): propose isolated proof of real Codex execution'
          git push origin "HEAD:refs/heads/$KAIRO_BRANCH"
          gh pr create --repo "$GITHUB_REPOSITORY" --head "$KAIRO_BRANCH" --base main --draft \
            --title 'agent(#13): independently review bounded coding pilot' \
            --body "Automated UNREVIEWED pilot for Issue #13. GitHub Actions run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Source scope: tools/kairo-agent-proof-20261025 only. Requires independent review, exact-head CI and conditional merge policy; NEVER auto-merge or deploy."
