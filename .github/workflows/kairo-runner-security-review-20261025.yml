name: KAIRO runner independent security regressions
on:
  pull_request:
    paths:
      - 'tools/runner-security-review-20261025/**'
      - '.github/workflows/kairo-runner-security-review-20261025.yml'
permissions:
  contents: read
jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node --test tools/runner-security-review-20261025/gate.test.mjs
