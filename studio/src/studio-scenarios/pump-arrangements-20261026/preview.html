<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>KAIRO | Two pumps: series or parallel?</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #f1f6ff; background: #071727; }
    body { margin: 0; }
    main { max-width: 960px; margin: auto; padding: clamp(1rem, 4vw, 3rem); }
    h1 { font-size: clamp(2rem, 5vw, 3.6rem); line-height: 1.08; }
    h2 { font-size: 1.45rem; }
    .hero { border: 1px solid #4b7189; border-radius: 1.4rem; padding: clamp(1.5rem, 4vw, 3rem); background: radial-gradient(circle at 85% 15%, #24567d, transparent 50%), linear-gradient(125deg, #183951, #0b2035); }
    .eyebrow { color: #88f5d5; font-size: .78rem; font-weight: 800; letter-spacing: .11em; }
    .card, .notice, .sources { background: #10283d; border: 1px solid #40657c; border-radius: 1.2rem; padding: 1.4rem; margin: 1.3rem 0; }
    .notice { background: #2c3041; border-color: #9b9368; }
    .field { display: grid; gap: .5rem; font-weight: 650; margin: 1.2rem 0; }
    select, textarea, button { font: inherit; }
    select, textarea { box-sizing: border-box; width: 100%; padding: .75rem; border: 1px solid #9ab3c7; border-radius: .6rem; background: #0c2032; color: #fff; }
    button { border: 2px solid transparent; border-radius: .7rem; background: #8af1d3; color: #052b31; font-weight: 750; padding: .75rem 1rem; cursor: pointer; margin: .35rem .4rem .35rem 0; }
    button:hover { background: #bcffeb; }
    :focus-visible { outline: 3px solid #ffd083; outline-offset: 4px; }
    fieldset { border: 1px solid #7796ac; border-radius: .75rem; margin: 1rem 0; padding: .8rem 1rem; }
    legend { font-weight: 750; padding: .4rem; }
    .radio { display: flex; align-items: baseline; gap: .65rem; margin: .7rem 0; }
    .radio input { width: 1.1rem; height: 1.1rem; }
    .flow-chart { width: 100%; max-height: 220px; border-radius: .7rem; background: #091d2e; }
    table { border-collapse: collapse; width: 100%; text-align: left; }
    caption { text-align: left; font-weight: 700; padding: .8rem 0; }
    th, td { padding: .65rem .45rem; border-bottom: 1px solid #3b6178; }
    .feedback { font-size: 1.08rem; font-weight: 750; }
    .limit { border-left: 3px solid #ffd083; padding-left: .8rem; }
    .complete { color: #91f6d8; font-weight: 700; }
    .status { min-height: 1.6em; }
    a { color: #a7e8ff; }
    @media (max-width: 620px) { .card, .notice, .sources { padding: 1rem; } table { display: block; overflow-x: auto; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main id="pump-arrangements-app"></main>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
