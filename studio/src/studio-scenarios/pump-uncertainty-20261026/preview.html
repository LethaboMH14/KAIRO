<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>KAIRO | Pump measurement uncertainty lab</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #f4f7ff; background: #071626; }
    body { margin: 0; }
    main { max-width: 940px; margin: auto; padding: clamp(1rem, 4vw, 3rem); }
    .hero { border-radius: 1.5rem; padding: clamp(1.4rem, 4vw, 3rem); background: radial-gradient(circle at 80% 10%, #28577c, transparent 50%), linear-gradient(120deg, #183750, #0b1f35); border: 1px solid #43637d; }
    h1 { font-size: clamp(2rem, 5vw, 3.7rem); line-height: 1.08; margin: .6rem 0 1rem; }
    h2 { font-size: 1.5rem; }
    .eyebrow { color: #76ebcf; letter-spacing: .12em; font-size: .8rem; font-weight: 750; }
    .notice, .challenge, .result-card, .record-tools { margin: 1.4rem 0; padding: 1.5rem; border: 1px solid #385b75; border-radius: 1.25rem; background: #11283e; }
    .notice { background: #2b3040; border-color: #8d8a65; }
    .field { display: grid; gap: .4rem; margin: 1rem 0; font-weight: 650; }
    input, select, textarea, button { font: inherit; }
    select, textarea { box-sizing: border-box; width: 100%; border: 1px solid #93a8ba; border-radius: .6rem; padding: .7rem; color: #fff; background: #10253b; }
    button { background: #78f0d5; color: #072b34; border: 2px solid transparent; border-radius: .7rem; padding: .7rem 1rem; font-weight: 750; cursor: pointer; margin: .35rem .35rem .35rem 0; }
    button:hover { background: #b5ffed; }
    :focus-visible { outline: 3px solid #ffcc72; outline-offset: 4px; }
    fieldset { border: 1px solid #7191aa; border-radius: .75rem; padding: 1rem; }
    legend { font-weight: 650; padding: .3rem; }
    .radio { display: flex; gap: .7rem; align-items: baseline; margin: .6rem 0; }
    .radio input { width: 1.1rem; height: 1.1rem; }
    .interval-chart { width: 100%; max-height: 200px; background: #091c2e; border-radius: .7rem; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    caption { text-align: left; font-weight: 700; padding: .7rem 0; }
    th, td { border-bottom: 1px solid #3a5b72; padding: .65rem .4rem; }
    th { width: 35%; }
    .feedback { font-size: 1.1rem; font-weight: 700; }
    .limit { color: #d6e1ef; border-left: 3px solid #ffca76; padding-left: .8rem; }
    .complete { font-size: 1.2rem; color: #7ff1d4; }
    .live { min-height: 1.5em; }
    @media (max-width: 600px) { .notice, .challenge, .result-card, .record-tools { padding: 1rem; } th { width: 42%; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main id="pump-uncertainty-app"></main>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
